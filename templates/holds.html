{% extends "base.html" %}
{% block title %}Holds – Bibliorecs{% endblock %}

{% block content %}
<h1 class="page-title" id="page-title">Your Holds</h1>
<div id="holds-container" class="loading-state">
  <div class="spinner"></div>
  <p>Loading your holds...</p>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var container = document.getElementById('holds-container');

  function renderItem(h) {
    var isbn = h.isbn || '';
    var syndetics = 'https://secure.syndetics.com/index.aspx?isbn=' + isbn + '/LC.GIF&client=sepup&type=xw12&oclc=';
    var openlibrary = 'https://covers.openlibrary.org/b/isbn/' + isbn + '-L.jpg';
    var isReady = h.status === 'READY_FOR_PICKUP';
    var badge = isReady
      ? '<span class="hold-badge hold-ready">Ready for Pickup</span>'
      : '<span class="hold-badge hold-queued">' + (h.position && h.position > 0 ? 'Position #' + h.position : 'On Hold') + '</span>';
    var expiry = '';
    if (isReady && h.expiry_date) {
      var d = new Date(h.expiry_date);
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var formatted = months[d.getMonth()] + ' ' + d.getDate();
      var today = new Date(); today.setHours(0,0,0,0);
      var delta = Math.round((d - today) / 86400000);
      var daysLeft = delta > 0 ? delta + ' days left' : (delta === 0 ? 'today' : (-delta) + ' days ago');
      expiry = '<span class="hold-expiry"><span class="due-date">Pick up by ' + formatted + '</span><span class="due-relative">' + daysLeft + '</span></span>';
    }

    return '<a href="/book/' + h.metadata_id + '" class="history-item">'
      + '<div class="history-cover-wrap">'
      + '<img class="history-cover cover-img" src="' + syndetics + '" alt="" loading="lazy" data-fallback="' + openlibrary + '">'
      + '<div class="cover-placeholder cover-placeholder-sm">📖</div>'
      + '</div>'
      + '<div class="history-body">'
      + '<div class="title">' + (h.title || '') + '</div>'
      + (h.subtitle ? '<div class="sub">' + h.subtitle + '</div>' : '')
      + '<div class="sub">' + (h.author || '') + '</div>'
      + '</div>'
      + '<div class="hold-status-wrap">'
      + badge
      + expiry
      + '<button class="btn-cancel" data-hold-id="' + h.hold_id + '" data-mid="' + h.metadata_id + '">Cancel</button>'
      + '</div>'
      + '</a>';
  }

  function renderSection(title, items) {
    if (!items.length) return '';
    var html = '<div class="section"><h2 class="section-title">' + title + ' (' + items.length + ')</h2>';
    items.forEach(function(h) { html += renderItem(h); });
    html += '</div>';
    return html;
  }

  function renderHolds(holds) {
    var ready = holds.filter(function(h) { return h.status === 'READY_FOR_PICKUP'; });
    var waiting = holds.filter(function(h) { return h.status !== 'READY_FOR_PICKUP'; });
    var html = renderSection('Ready for Pickup', ready) + renderSection('On Hold', waiting);

    if (!html) {
      html = '<div class="empty-state"><h2>No holds</h2><p>Place holds on recommended books from the home page.</p><a href="/" class="btn btn-primary" style="margin-top:12px">Browse Recommendations</a></div>';
      document.getElementById('page-title').textContent = 'Your Holds';
    } else {
      document.getElementById('page-title').textContent = 'Your Holds (' + holds.length + ')';
    }

    container.className = '';
    container.innerHTML = html;
    attachCancel();
  }

  function renderError(msg) {
    document.getElementById('page-title').textContent = 'Your Holds';
    container.className = 'empty-state';
    container.innerHTML = '<h2>Could not load holds</h2><p style="color:#86868b;margin-top:4px">' + (msg || 'Unknown error') + '</p><button onclick="location.reload()" class="btn btn-primary" style="margin-top:12px">Retry</button>';
  }

  function attachCancel() {
    document.querySelectorAll('.btn-cancel').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (btn.dataset.confirming) {
          var holdId = btn.dataset.holdId;
          var mid = btn.dataset.mid;
          btn.textContent = 'Cancelling...';
          btn.disabled = true;
          fetch('/api/hold/cancel', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({hold_id: holdId, metadata_id: mid})
          })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.success) {
              var item = btn.closest('.history-item');
              item.style.opacity = '0.3';
              item.style.pointerEvents = 'none';
              btn.textContent = 'Cancelled';
            } else {
              btn.textContent = 'Failed';
              btn.dataset.confirming = '';
            }
          })
          .catch(function() {
            btn.textContent = 'Failed';
            btn.dataset.confirming = '';
          });
        } else {
          btn.dataset.confirming = '1';
          btn.textContent = 'Confirm?';
          setTimeout(function() { if (btn.dataset.confirming) { delete btn.dataset.confirming; btn.textContent = 'Cancel'; } }, 5000);
        }
      });
    });
  }

  fetch('/api/holds')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.holds) {
        renderHolds(data.holds);
      } else {
        renderError(data.error);
      }
    })
    .catch(function() {
      renderError('Network error');
    });
})();
</script>
{% endblock %}
