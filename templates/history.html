{% extends "base.html" %}
{% block title %}History – Bibliorecs{% endblock %}

{% block content %}
<h1 class="page-title">
  Borrowing History
  <span id="sync-indicator" class="sync-indicator" style="display:none"></span>
</h1>

<div id="history-content">
  <div class="section" id="section-current" style="display:none"></div>

  <div id="chart-wrap" style="display:none">
    <canvas id="history-chart"></canvas>
  </div>

  <div class="section" id="section-past" style="display:none"></div>

  <div class="empty-state" id="history-empty" style="display:none">
    <h2>No borrowing history</h2>
    <p id="history-empty-msg"></p>
    <a id="history-empty-btn" href="/settings" class="btn btn-primary" style="margin-top:12px;display:inline-block;text-decoration:none">Go to Settings</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var indicator = document.getElementById('sync-indicator');

  function setIndicator(text, cls) {
    indicator.style.display = '';
    indicator.className = 'sync-indicator' + (cls ? ' ' + cls : '');
    indicator.textContent = '';
    indicator.appendChild(document.createTextNode(text));
  }

  function hideIndicator() {
    indicator.style.display = 'none';
  }

  function renderItems(items, containerId, isCurrent) {
    var container = document.getElementById(containerId);
    if (!container) return;

    if (!items.length) {
      container.style.display = 'none';
      return;
    }

    var label = isCurrent ? 'Currently Checked Out' : 'Past Borrows';
    var html = '<h2 class="section-title">' + label + ' (' + items.length + ')</h2>';
    items.forEach(function(item) {
      var dateHtml;
      if (isCurrent) {
        var label = item.due_label_compact || item.checkout_date || '';
        var remain = item.due_remaining || '';
        dateHtml = '<span class="due-date">' + label + '</span>';
        if (remain) dateHtml += '<span class="due-relative">' + remain + '</span>';
      } else {
        dateHtml = '<span class="due-date">' + (item.checkout_date || '') + '</span>';
      }
      html += '<a href="/book/' + item.metadata_id + '?isbn=' + (item.isbn || '') + '" class="history-item">'
        + '<div class="history-cover-wrap">'
        + '<img class="history-cover cover-img" src="' + item.img_url + '" alt="" loading="lazy" data-fallback="' + item.fallback_url + '" data-isbn="' + (item.isbn || '') + '">'
        + '<div class="cover-placeholder cover-placeholder-sm">📖</div>'
        + '</div>'
        + '<div class="history-body">'
        + '<div class="title">' + (item.title || item.metadata_id) + '</div>'
        + (item.subtitle ? '<div class="sub">' + item.subtitle + '</div>' : '')
        + '<div class="sub">' + (item.author || '') + '</div>'
        + '</div>'
        + '<span class="history-date">' + dateHtml + '</span>'
        + '</a>';
    });
    container.innerHTML = html;
    container.style.display = '';
  }

  function updateContent(data, hasCard) {
    renderItems(data.current || [], 'section-current', true);
    renderItems(data.past || [], 'section-past', false);

    var emptyState = document.getElementById('history-empty');
    var emptyMsg = document.getElementById('history-empty-msg');
    var emptyBtn = document.getElementById('history-empty-btn');
    if (!emptyState) return;

    var hasData = (data.current && data.current.length) || (data.past && data.past.length);
    if (hasData) {
      emptyState.style.display = 'none';
    } else if (hasCard) {
      emptyMsg.textContent = 'No borrowing history — borrow some books and they\'ll show up here.';
      emptyBtn.style.display = 'none';
      emptyState.style.display = '';
    } else {
      emptyMsg.textContent = 'Connect a library card in Settings to sync your borrowing history.';
      emptyBtn.style.display = '';
      emptyState.style.display = '';
    }
  }

  function fmtDueLabel(dateStr) {
    if (!dateStr) return null;
    try {
      var d = new Date(dateStr.slice(0,10));
      var today = new Date(); today.setHours(0,0,0,0);
      var delta = Math.round((d - today) / 86400000);
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var fmt = months[d.getMonth()] + ' ' + d.getDate();
      if (delta < 0) return {label: 'Overdue ' + fmt, remain: (-delta) + ' days ago'};
      if (delta === 0) return {label: 'Due today', remain: null};
      if (delta === 1) return {label: 'Due ' + fmt, remain: '1 day left'};
      return {label: 'Due ' + fmt, remain: delta + ' days left'};
    } catch(e) { return null; }
  }

  function computeCharts(allEntries, allBibs) {
    // Monthly borrow chart
    var dateCounts = {};
    Object.keys(allEntries).forEach(function(k) {
      var date = allEntries[k].checkedoutDate;
      if (date) {
        var month = date.slice(0, 7);
        dateCounts[month] = (dateCounts[month] || 0) + 1;
      }
    });

    var months = Object.keys(dateCounts).sort();
    if (!months.length) return;

    var chartData = [];
    var cumulative = 0;
    months.forEach(function(m) {
      cumulative += dateCounts[m];
      chartData.push({m: m, b: dateCounts[m], c: cumulative});
    });

    drawChart(chartData);
  }

  function drawChart(months) {
    var canvas = document.getElementById('history-chart');
    if (!canvas || !months.length) return;
    document.getElementById('chart-wrap').style.display = '';

    var wrap = document.getElementById('chart-wrap');
    var rect = wrap.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var W = rect.width;
    var H = 200;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    var PAD = {top: 20, bottom: 30, left: 36, right: 36};
    var plotW = W - PAD.left - PAD.right;
    var plotH = H - PAD.top - PAD.bottom;

    var maxB = 0, maxC = 0;
    months.forEach(function(m) {
      if (m.b > maxB) maxB = m.b;
      if (m.c > maxC) maxC = m.c;
    });
    if (maxB === 0) maxB = 1;
    if (maxC === 0) maxC = 1;

    var n = months.length;
    var barW = Math.min(20, plotW / n * 0.7);
    var gap = plotW / n;

    function xPos(i) { return PAD.left + i * gap + gap / 2; }
    function yBar(v) { return PAD.top + plotH - (v / maxB) * plotH; }
    function yLine(v) { return PAD.top + plotH - (v / maxC) * plotH; }

    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = '#f0f0f2';
    ctx.lineWidth = 1;
    for (var g = 0; g <= 4; g++) {
      var yy = PAD.top + plotH * (1 - g / 4);
      ctx.beginPath();
      ctx.moveTo(PAD.left, yy);
      ctx.lineTo(W - PAD.right, yy);
      ctx.stroke();
    }

    for (var i = 0; i < n; i++) {
      var x = xPos(i) - barW / 2;
      var y = yBar(months[i].b);
      var h = PAD.top + plotH - y;
      ctx.fillStyle = '#c7d2fe';
      ctx.beginPath();
      ctx.moveTo(x, PAD.top + plotH);
      ctx.lineTo(x, y + 4);
      ctx.quadraticCurveTo(x, y, x + 4, y);
      ctx.lineTo(x + barW - 4, y);
      ctx.quadraticCurveTo(x + barW, y, x + barW, y + 4);
      ctx.lineTo(x + barW, PAD.top + plotH);
      ctx.closePath();
      ctx.fill();
    }

    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      var xx = xPos(i);
      var yy = yLine(months[i].c);
      if (i === 0) ctx.moveTo(xx, yy);
      else ctx.lineTo(xx, yy);
    }
    ctx.stroke();

    for (var i = 0; i < n; i++) {
      var xx = xPos(i);
      var yy = yLine(months[i].c);
      ctx.fillStyle = '#2563eb';
      ctx.beginPath();
      ctx.arc(xx, yy, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#86868b';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (var g = 0; g <= 4; g++) {
      var v = Math.round(maxB * g / 4);
      var yy = PAD.top + plotH * (1 - g / 4);
      ctx.fillText(v, PAD.left - 6, yy);
    }

    ctx.textAlign = 'left';
    for (var g = 0; g <= 4; g++) {
      var v = Math.round(maxC * g / 4);
      var yy = PAD.top + plotH * (1 - g / 4);
      ctx.fillText(v, W - PAD.right + 6, yy);
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    var maxLabelW = 0;
    for (var i = 0; i < n; i++) {
      var w = ctx.measureText(months[i].m).width;
      if (w > maxLabelW) maxLabelW = w;
    }
    var step = Math.max(1, Math.ceil((maxLabelW + 6) / (plotW / n)));
    for (var i = 0; i < n; i += step) {
      ctx.fillText(months[i].m, xPos(i), PAD.top + plotH + 6);
    }
  }

  function buildRenderData(history, syndeticsClient) {
    var current = [], past = [];
    history.forEach(function(b) {
      var isbn = (b.isbns || [])[0] || '';
      var item = {
        metadata_id: b.metadata_id,
        checkout_date: b.checkout_date,
        title: b.title || '',
        subtitle: b.subtitle || '',
        author: (b.authors || []).join(', '),
        isbn: isbn,
        _format: b.format || '',
        img_url: isbn ? 'https://secure.syndetics.com/index.aspx?isbn=' + isbn + '/LC.GIF&client=' + syndeticsClient + '&type=xw12&oclc=' : '',
        fallback_url: isbn ? 'https://covers.openlibrary.org/b/isbn/' + isbn + '-L.jpg' : ''
      };
      if (b.is_current) {
        var dl = fmtDueLabel(b.checkout_date);
        if (dl) { item.due_label_compact = dl.label; item.due_remaining = dl.remain; }
        current.push(item);
      } else {
        past.push(item);
      }
    });
    current.sort(function(a, b) {
      if (!a.checkout_date) return 1;
      if (!b.checkout_date) return -1;
      return a.checkout_date.localeCompare(b.checkout_date);
    });
    past.sort(function(a, b) {
      if (!a.checkout_date) return 1;
      if (!b.checkout_date) return -1;
      return b.checkout_date.localeCompare(a.checkout_date);
    });
    return {current: current, past: past};
  }

  function loadCached() {
    var libId = document.body.getAttribute('data-lib');
    var syndeticsClient = document.body.getAttribute('data-syndetics') || 'sepup';
    try {
      var all = JSON.parse(localStorage.getItem('bibliorecs_history_' + libId));
      if (all && all.length) {
        var renderData = buildRenderData(all, syndeticsClient);
        updateContent(renderData, true);
        return;
      }
    } catch(e) {}
    var creds = getCreds();
    if (creds[libId] && creds[libId].bc_token) {
      document.getElementById('history-empty-msg').textContent = 'Syncing your borrowing history...';
      document.getElementById('history-empty-btn').style.display = 'none';
      document.getElementById('history-empty').style.display = '';
    } else {
      updateContent({current: [], past: []}, false);
    }
  }

  function doSync() {
    var libId = document.body.getAttribute('data-lib');
    var syndeticsClient = document.body.getAttribute('data-syndetics') || 'sepup';
    var creds = getCreds();
    var libCreds = creds[libId];
    if (!libCreds || !libCreds.bc_token) {
      document.getElementById('history-empty-msg').textContent = 'Connect a library card in Settings to sync your borrowing history.';
      document.getElementById('history-empty-btn').style.display = '';
      hideIndicator();
      return;
    }

    setIndicator('\u27F3 Syncing');

    var allEntries = {};
    var allBibs = {};

    function fetchHistoryPage(page) {
      return proxyFetch('/api/proxy/history', {page: page}).then(function(data) {
        var entries = data.entities.borrowingHistory || {};
        var keys = Object.keys(entries);
        if (keys.length === 0 || page > 100) return;
        Object.assign(allBibs, data.entities.bibs || {});
        keys.forEach(function(k) { allEntries[k] = entries[k]; });
        return fetchHistoryPage(page + 1);
      });
    }

    function dedupItems(items, keyFn) {
      var seen = {}, result = [];
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var k = keyFn ? keyFn(item) : item;
        if (typeof k === 'string') k = k.trim().toLowerCase();
        if (!k) continue;
        if (!seen[k]) { seen[k] = true; result.push(item); }
      }
      return result;
    }

    function buildBorrowingHistory(entries, bibs) {
      var seen = {};
      var borrowingHistory = [];
      Object.keys(entries).forEach(function(k) {
        var entry = entries[k];
        var bib = (bibs[entry.metadataId] || {}).briefInfo || {};
        var key = entry.metadataId + '|' + (entry.checkedoutDate || '');
        if (!seen[key]) {
          seen[key] = true;
          borrowingHistory.push({
            metadata_id: entry.metadataId,
            title: bib.title || '',
            subtitle: bib.subtitle || '',
            authors: dedupItems(bib.authors || []),
            series: dedupItems(bib.series || [], function(s) { return (s && (s.name || s)) || ''; }),
            isbns: bib.isbns || [],
            subjects: dedupItems(bib.subjectHeadings || []),
            genres: bib.genreForm || [],
            content_type: bib.contentType || '',
            format: bib.format || '',
            checkout_date: entry.checkedoutDate,
            is_current: false
          });
        }
      });
      return borrowingHistory;
    }

    fetchHistoryPage(1).then(function() {
      return proxyFetch('/api/proxy/checkouts', {});
    }).then(function(checkoutsData) {
      Object.assign(allBibs, checkoutsData.entities.bibs || {});
      var checkoutsObj = (checkoutsData.entities || {}).checkouts || {};

      // Build unified borrowing history (past + current)
      var borrowingHistory = buildBorrowingHistory(allEntries, allBibs);
      Object.keys(checkoutsObj).forEach(function(k) {
        var co = checkoutsObj[k];
        var bib = (allBibs[co.metadataId] || {}).briefInfo || {};
        borrowingHistory.push({
          metadata_id: co.metadataId,
          title: bib.title || co.bibTitle || '',
          subtitle: bib.subtitle || '',
          authors: dedupItems(bib.authors || []),
          series: dedupItems(bib.series || [], function(s) { return (s && (s.name || s)) || ''; }),
          isbns: bib.isbns || [],
          subjects: dedupItems(bib.subjectHeadings || []),
          genres: bib.genreForm || [],
          content_type: bib.contentType || '',
          format: bib.format || '',
          checkout_date: co.dueDate,
          is_current: true
        });
      });
      try { localStorage.setItem('bibliorecs_history_' + libId, JSON.stringify(borrowingHistory)); } catch(e) {}

      // Build render data
      var renderData = buildRenderData(borrowingHistory, syndeticsClient);

      // Update content
      updateContent(renderData, true);
      document.querySelectorAll('img.cover-img').forEach(function(img) {
        if (typeof initCoverFallback === 'function') initCoverFallback(img);
      });

      // Compute charts client-side
      computeCharts(allEntries, allBibs);

      hideIndicator();
      var itemCount = renderData.past.length + renderData.current.length;
      if (itemCount > 0) {
        setIndicator('\u2713 Updated (' + itemCount + ' items)', 'sync-done');
      }
      setTimeout(hideIndicator, 3000);
    })
    .catch(function() {
      hideIndicator();
      showToast('Sync failed', 5000);
    });
  }

  var resizeTimer;
  var onResize = function() {
    var canvas = document.getElementById('history-chart');
    if (canvas && canvas.chartData) drawChart(canvas.chartData);
  };
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(onResize, 200);
  });

  loadCached();
  doSync();
})();
</script>
{% endblock %}
