{% extends "base.html" %}
{% block title %}{{ metadata_id }} – Bibliorecs{% endblock %}

{% block content %}
<div class="book-detail">
  <div class="book-cover-large">
    <div class="book-cover-wrap">
      <img class="cover-img" src="{{ img_url }}"
           alt="" loading="lazy"
           data-fallback="{{ fallback_url }}"
           data-isbn="{{ isbn }}">
      <div class="cover-placeholder cover-placeholder-lg">📖</div>
    </div>
  </div>
  <div class="book-info">
    <h1 id="book-title"></h1>
    <p class="book-subtitle" id="book-subtitle" style="display:none"></p>
    <p class="author" id="book-author" style="display:none"></p>
    <div class="series-row" id="book-series" style="display:none"></div>
    <p class="metadata" id="book-metadata" style="display:none"></p>
    <p class="description" id="book-description" style="display:none"></p>
    <div class="tag-section" id="book-subjects" style="display:none"></div>
    <div class="tag-section genre-section" id="book-genres" style="display:none"></div>
  </div>
</div>

{% if isbn %}
<div id="preview-overlay" class="preview-overlay">
  <div class="preview-modal">
    <div class="preview-header">
      <span class="preview-title">Book Preview</span>
      <button id="preview-close" class="preview-close" aria-label="Close preview">&times;</button>
    </div>
    <div id="viewerCanvas"></div>
  </div>
</div>
{% endif %}

<div id="hold-section" class="section" style="display:none">
  <h2 class="section-title">Hold Status</h2>
  <div id="hold-content" class="hold-block"></div>
</div>
{% endblock %}

{% block scripts %}
{% if isbn %}
<script>
(function() {
  var isbn = '{{ isbn }}';
  var overlay = document.getElementById('preview-overlay');
  var canvas = document.getElementById('viewerCanvas');
  var slot = document.querySelector('.book-cover-wrap');

  function handleResponse(data) {
    var key = 'ISBN:' + isbn;
    if (data && data[key] && data[key].preview_url && data[key].embeddable) {
      var btn = document.createElement('button');
      btn.className = 'btn-preview';
      btn.textContent = 'Preview this book';
      btn.addEventListener('click', function() {
        canvas.innerHTML = '';
        var iframe = document.createElement('iframe');
        iframe.src = data[key].preview_url + '&output=embed';
        iframe.style.cssText = 'width:100%;height:100%;border:0';
        iframe.allow = 'clipboard-read; clipboard-write';
        canvas.appendChild(iframe);
        overlay.style.display = 'flex';
      });
      slot.appendChild(btn);
    }
    cleanup();
  }

  function cleanup() {
    var s = document.getElementById('gbs-jsonp');
    if (s) s.parentNode.removeChild(s);
    delete window['gbs_cb_' + isbn.replace(/[^a-zA-Z0-9]/g, '_')];
  }

  var callbackName = 'gbs_cb_' + isbn.replace(/[^a-zA-Z0-9]/g, '_');
  window[callbackName] = handleResponse;

  var script = document.createElement('script');
  script.id = 'gbs-jsonp';
  script.src = 'https://books.google.com/books?jscmd=viewapi&bibkeys=ISBN:' + encodeURIComponent(isbn) + '&callback=' + callbackName;
  document.head.appendChild(script);

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.style.display = 'none';
  });

  document.getElementById('preview-close').addEventListener('click', function() {
    overlay.style.display = 'none';
  });
})();
</script>
{% endif %}
<script>
var mid = '{{ metadata_id }}';
var isbn = '{{ isbn }}';

function _json_list(v) {
  try { return JSON.parse(v) || []; } catch(e) { return []; }
}

function _clean_subject(s) {
  return s.replace(/ -- /g, ' ').replace(/<delimit>/g, '');
}

function _dedup(arr) {
  var seen = {}, out = [];
  arr.forEach(function(v) { var k = v.toLowerCase().trim(); if (!seen[k]) { seen[k] = true; out.push(v); } });
  return out;
}

function renderBook(data) {
  var title = data.title || mid;
  document.getElementById('book-title').textContent = title;
  document.title = title + ' – Bibliorecs';

  var authorEl = document.getElementById('book-author');
  var author = data.author;
  if (!author) {
    var authors = _json_list(data.authors);
    author = authors.join(', ');
  }
  if (author) {
    authorEl.textContent = author;
    authorEl.style.display = '';
  }

  var subEl = document.getElementById('book-subtitle');
  if (data.subtitle) {
    subEl.textContent = data.subtitle;
    subEl.style.display = '';
  }

  var seriesEl = document.getElementById('book-series');
  var seriesList = _json_list(data.series);
  if (!seriesList.length && data.series_name) {
    seriesList = [{name: data.series_name}];
  }
  if (seriesList.length) {
    var names = seriesList.map(function(s) {
      var n = s.name || s;
      return '<span class="series-pill">' + n + '</span>';
    }).join('');
    seriesEl.innerHTML = '<span class="series-label">Series</span>' + names;
    seriesEl.style.display = '';
  }

  var metaEl = document.getElementById('book-metadata');
  var parts = [];
  var fmt = data.format_label || data.format;
  if (fmt) parts.push(fmt.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); }));
  var ct = data.content_type;
  if (ct) {
    var ctMap = {FICTION: 'Fiction', NON_FICTION: 'Non-Fiction'};
    parts.push(ctMap[ct] || ct);
  }
  if (data.publication_year) parts.push(data.publication_year);
  if (data.primary_language) {
    var langMap = {eng: 'English', spa: 'Spanish', chi: 'Chinese'};
    parts.push(langMap[data.primary_language] || data.primary_language);
  }
  var avg = data.rating_avg;
  var cnt = data.rating_count;
  if (avg && cnt) {
    var s = Math.round(avg / 20);
    var stars = '';
    for (var ri = 0; ri < 5; ri++) stars += ri < s ? '★' : '☆';
    parts.push(stars + ' (' + cnt.toLocaleString() + ' ratings)');
  }
  if (parts.length) {
    metaEl.innerHTML = parts.map(function(p) { return '<span>' + p + '</span>'; }).join('');
    metaEl.style.display = '';
  }

  var descEl = document.getElementById('book-description');
  if (data.description) {
    descEl.textContent = data.description;
    descEl.style.display = '';
  }

  var subjectsEl = document.getElementById('book-subjects');
  var subjects = _json_list(data.subjects);
  if (subjects.length) {
    var clean = _dedup(subjects.map(_clean_subject).filter(function(s) { return s; }));
    if (clean.length) {
      subjectsEl.innerHTML = '<div class="tag-list">' + clean.map(function(s) { return '<span class="tag">' + s + '</span>'; }).join('') + '</div>';
      subjectsEl.style.display = '';
    }
  }

  var genresEl = document.getElementById('book-genres');
  var genres = _json_list(data.genres);
  if (genres.length) {
    var cleanG = _dedup(genres.map(function(g) { return g.replace(/<delimit>/g, ' ').replace(/\|/g, ' ').trim(); }).filter(function(g) { return g; }));
    if (cleanG.length) {
      genresEl.innerHTML = '<div class="tag-list">' + cleanG.map(function(g) { return '<span class="tag tag-genre">' + g + '</span>'; }).join('') + '</div>';
      genresEl.style.display = '';
    }
  }
}

// Async fetch full data
if (isbn) {
  fetch('/api/bib/' + mid + '?isbn=' + encodeURIComponent(isbn))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && !data.error) {
        renderBook(data);
      }
    })
    .catch(function() {});
}

// ── Hold status (unchanged) ──
var holdSection = document.getElementById('hold-section');
var holdContent = document.getElementById('hold-content');

function showLoading() {
  holdContent.innerHTML = '<div class="hold-status"><span class="hold-status-label">Checking hold status...</span></div>';
  holdSection.style.display = '';
}

function showCheckedOut() {
  holdContent.innerHTML = '<div class="hold-status"><span class="hold-status-label muted">You have this checked out.</span></div>';
  holdSection.style.display = '';
}

function showReady(h) {
  var expiry = h.pickupByDate ? '<div class="hold-expiry">Pick up by ' + h.pickupByDate.slice(0,10) + '</div>' : '';
  holdContent.innerHTML =
    '<div class="hold-status hold-status-ready">' +
      '<span class="hold-status-badge">Ready for Pickup</span>' +
      expiry +
    '</div>';
  holdSection.style.display = '';
}

function showOnHold(h) {
  var pos = (h.holdsPosition || h.position);
  var posStr = (pos && pos > 0) ? ' — Position #' + pos : '';
  holdContent.innerHTML =
    '<div class="hold-status hold-status-queued">' +
      '<span class="hold-status-badge">On hold' + posStr + '</span>' +
    '</div>';
  holdSection.style.display = '';
}

function showPlaceHold() {
  holdContent.innerHTML =
    '<button class="btn-hold-main" data-mid="' + mid + '">Place Hold</button>';
  holdSection.style.display = '';
}

function showHoldError(msg) {
  holdContent.innerHTML =
    '<div class="hold-status hold-status-error">' +
      '<span class="hold-status-badge"></span>' +
    '</div>' +
    '<button class="btn-hold-main" data-mid="' + mid + '">Place Hold</button>';
  holdContent.querySelector('.hold-status-badge').textContent = msg;
  holdSection.style.display = '';
  showToast(msg, 8000);
}

function showNoCreds() {
  holdContent.innerHTML = '<div class="hold-status"><span class="hold-status-label">Connect your library card in Settings to place holds.</span></div>';
  holdSection.style.display = '';
}

  var libId = document.body.getAttribute('data-lib');
  var creds = getCreds();
  var libCreds = creds[libId];

  showLoading();

  if (!libCreds || !libCreds.bc_token) {
    showNoCreds();
  } else {
    Promise.all([
      proxyFetch('/api/proxy/holds', {}),
      proxyFetch('/api/proxy/checkouts', {})
    ]).then(function(results) {
      var holdsData = results[0], checkoutsData = results[1];

    var checkoutsObj = (checkoutsData.entities || {}).checkouts || {};
    var isCheckedOut = false;
    Object.keys(checkoutsObj).forEach(function(k) {
      if (checkoutsObj[k].metadataId === mid) isCheckedOut = true;
    });
    if (isCheckedOut) { showCheckedOut(); return; }

    var holdsObj = (holdsData.entities || {}).holds || {};
    var myHold = null;
    Object.keys(holdsObj).forEach(function(k) {
      if (holdsObj[k].metadataId === mid) myHold = holdsObj[k];
    });
    if (myHold) {
      if (myHold.status === 'READY_FOR_PICKUP')
        { showReady(myHold); return; }
      showOnHold(myHold);
      return;
    }

    showPlaceHold();
  });
}

document.addEventListener('click', function(e) {
  var btn = e.target.closest('.btn-hold-main');
  if (!btn) return;
  e.preventDefault();
  var libId = document.body.getAttribute('data-lib');
  var creds = getCreds();
  var libCreds = creds[libId];
  if (!libCreds || !libCreds.bc_token) {
    showToast('Connect a library card in Settings to place holds', 4000);
    return;
  }
  btn.textContent = 'Placing...';
  btn.disabled = true;
  proxyFetch('/api/proxy/hold/place', {
    metadata_id: mid, branch_code: document.body.getAttribute('data-branch')
  })
  .then(function(d) {
    if (d.success) {
      showOnHold({position: d.position, hold_id: d.hold_id});
    } else {
      showHoldError(d.error || 'Hold failed');
    }
  })
  .catch(function() {
    showHoldError('Network error');
  });
});
</script>
{% endblock %}
