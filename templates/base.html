<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Bibliorecs{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-brand">Bibliorecs</a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/history" class="nav-link">History</a>
        <a href="/holds" class="nav-link">Holds</a>
        <a href="/stats" class="nav-link">Stats</a>
      </div>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.local-time').forEach(function(el) {
      var d = new Date(el.getAttribute('datetime'));
      if (!isNaN(d)) el.textContent = d.toLocaleString();
    });
    document.querySelectorAll('img.cover-img').forEach(function(img) {
      var fallbacks = [];
      var fb = img.getAttribute('data-fallback');
      if (fb) fallbacks.push(fb);
      var fbIdx = 0;
      var done = false;
      var olSearched = false;
      var olTimer = null;

      function tryFallback() {
        if (done) return false;
        if (fbIdx < fallbacks.length) {
          img.src = fallbacks[fbIdx++];
          return true;
        }
        if (!olSearched) return tryOlSearch();
        showPlaceholder();
        return false;
      }

      function tryOlSearch() {
        olSearched = true;
        var isbn = img.getAttribute('data-isbn');
        if (!isbn) return false;

        var safe = isbn.replace(/[^a-zA-Z0-9]/g, '_');
        var callbackName = 'ol_cb_' + safe;
        var timedOut = false;

        olTimer = setTimeout(function() {
          timedOut = true;
          window[callbackName] = function(){};
          showPlaceholder();
        }, 5000);

        window[callbackName] = function(data) {
          clearTimeout(olTimer);
          if (timedOut) return;
          try { delete window[callbackName]; } catch(e) {}
          window[callbackName] = null;
          if (data && data.docs && data.docs.length > 0 && data.docs[0].cover_i != null) {
            done = false;
            img.src = 'https://covers.openlibrary.org/b/id/' + data.docs[0].cover_i + '-L.jpg';
          } else {
            showPlaceholder();
          }
        };

        var script = document.createElement('script');
        script.src = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(isbn) + '&callback=' + callbackName;
        document.head.appendChild(script);
        return true;
      }

      function handleLoad() {
        if (done) return;
        if (img.naturalWidth <= 1 && img.naturalHeight <= 1) {
          tryFallback();
        } else {
          done = true;
        }
      }

      function handleError() {
        if (done) return;
        tryFallback();
      }

      function showPlaceholder() {
        done = true;
        img.style.display = 'none';
        var ph = img.parentNode.querySelector('.cover-placeholder');
        if (ph) ph.style.display = 'flex';
      }

      img.addEventListener('load', handleLoad);
      img.addEventListener('error', handleError);
    });
  });
  </script>
  <script>
  function showToast(msg, duration) {
    duration = duration || 5000;
    var t = document.querySelector('.toast');
    if (t) t.remove();
    t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.style.opacity = '0'; setTimeout(function() { t.remove(); }, 400); }, duration);
  }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
